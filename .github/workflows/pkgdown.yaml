on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    if: github.repository == 'judgelord/corporations'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto
          needs: website

      - name: Install package
        run: R CMD INSTALL .

      - name: Restore R environment
        run: Rscript -e 'renv::restore()'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Build site
        run: pkgdown::build_site_github_pages(install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          branch: gh-pages  # creates a hidden branch for the HTML
          folder: docs
