on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    if: github.repository == 'judgelord/corporations'

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: .
          extra-packages: |
            any::pkgdown
            any::quarto
          needs: website

      - name: Download udpipe model
        run: |
          model_dir <- tools::R_user_dir("corporations", which = "data")
          dir.create(model_dir, recursive = TRUE, showWarnings = FALSE)
          model_path <- file.path(model_dir, "english-ewt.udpipe")
          m_info <- udpipe::udpipe_download_model(language = "english", model_dir = model_dir)
          cat("Downloaded to:", m_info$file_model, "\n")
          file.rename(m_info$file_model, model_path)
        shell: Rscript {0}

      - name: Build site
        run: |
          options(pkgdown.internet = TRUE)
          pkgdown::build_site_github_pages(quiet = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          branch: gh-pages
          folder: docs
